version: "3.8"

services:
  redis:
    image: redis:alpine
    container_name: n8n_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6666:6379"
    networks:
      - automations_net

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    platform: linux/amd64
    environment:
      N8N_HOST: n8n
      WEBHOOK_URL: http://n8n:5678
      GENERIC_TIMEZONE: America/Sao_Paulo
      N8N_LOG_LEVEL: debug
      N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: true
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    networks:
      - automations_net

volumes:
  n8n_data:
  redis_data:

networks:
  automations_net:
    external: true
